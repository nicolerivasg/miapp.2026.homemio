<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cuaderno de Cuentas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#4A3B4E; --paper:#FFF6EF; --card:#FFFFFF; --line:#F5DCE4;
    --gold:#F2B84B; --coral:#FF8FA3; --sage:#7FD8BE; --steel:#7EC8E3; --plum:#B18FCF; --muted:#A6919C;
    --field:#FFF1E6; --track:#FDE6E0; --peach:#FFB37B;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Quicksand',sans-serif;}
  .ff-display{font-family:'Baloo 2',cursive;}
  .ff-mono{font-family:'JetBrains Mono',monospace;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px 60px;}
  h1,h2,h3{margin:0;}
  button{font-family:inherit; cursor:pointer; border:none;}
  input,select{font-family:inherit; font-size:14px;}
  ::-webkit-scrollbar{width:8px;height:8px;}

  .top-eyebrow{display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; padding-top:32px;}
  .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);}
  .subline{font-size:14px; color:var(--muted); margin:4px 0 20px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:20px;}
  .runway-card{padding:22px 24px;}
  .runway-top{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px; margin-bottom:12px;}
  .runway-label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:2px;}
  .runway-range{font-family:'Baloo 2',cursive; font-size:19px; font-weight:700;}
  .runway-range span{font-family:'Quicksand',sans-serif; font-weight:500; font-size:14px; color:var(--muted);}
  .runway-days{font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; text-align:right;}
  .runway-bar{position:relative; height:32px; border-radius:999px; overflow:hidden; background:var(--track); margin-bottom:6px;}
  .runway-fill-time{position:absolute; inset:0 0 0 0; border-radius:999px; opacity:.35;}
  .runway-fill-spent{position:absolute; top:0; bottom:0; left:0; border-radius:999px; background:var(--ink);}
  .runway-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 12px; font-size:12px; font-weight:600;}
  .warn-text{font-size:12px; margin-top:6px; font-weight:600; color:var(--coral); display:flex; align-items:center; gap:5px;}
  .hint-text{font-size:12px; margin-top:8px; color:var(--muted);}

  .tabnav{display:flex; flex-wrap:wrap; gap:4px; padding:4px; border-radius:999px; background:var(--track); width:fit-content; margin:22px 0;}
  .tabnav button{padding:9px 18px; border-radius:999px; font-size:14px; font-weight:600; background:transparent; color:var(--ink); display:flex; align-items:center; gap:6px; transition:.15s;}
  .tabnav button.active{background:var(--ink); color:var(--paper);}

  .grid-registrar{display:grid; grid-template-columns:1fr; gap:24px;}
  @media(min-width:860px){ .grid-registrar{grid-template-columns:2fr 3fr;} }
  .goals-strip{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:20px;}
  @media(min-width:600px){ .goals-strip{grid-template-columns:1fr 1.4fr;} }

  .form-card{padding:20px; height:fit-content;}
  .field-label{display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:6px;}
  .field{width:100%; border-radius:14px; padding:9px 12px; background:var(--field); border:1px solid var(--line); margin-bottom:16px;}
  .cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px;}
  .cat-btn{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px; border-radius:16px; background:var(--field); font-size:11px; font-weight:500; text-align:center; line-height:1.15;}
  .cat-btn .emoji{font-size:17px;}
  .cat-btn.active{color:var(--paper);}
  .person-row{display:flex; gap:8px; margin-bottom:16px;}
  .person-btn{flex:1; padding:9px; border-radius:14px; background:var(--field); font-weight:500; font-size:14px;}
  .person-btn.active{background:var(--ink); color:var(--paper);}
  .submit-btn{width:100%; padding:11px; border-radius:16px; background:var(--gold); color:var(--ink); font-weight:700; font-size:14px;}
  .err-text{font-size:12px; color:var(--coral); font-weight:600; margin:-8px 0 12px;}

  .tx-row{display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--line);}
  .tx-row:first-child{border-top:none;}
  .tx-icon{width:32px; height:32px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:15px; flex:none;}
  .tx-name{font-size:14px; font-weight:500;}
  .tx-sub{font-size:12px; color:var(--muted);}
  .tx-amount{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; margin-left:auto;}
  .tx-del{background:none; color:var(--coral); padding:6px; border-radius:6px; opacity:.5;}
  .tx-del:hover{opacity:1;}
  .empty-box{padding:34px; text-align:center; font-size:14px; color:var(--muted);}

  .kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px;}
  .kpi-card{padding:16px;}
  .kpi-top{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .kpi-icon{width:26px; height:26px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:13px;}
  .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:600; color:var(--muted);}
  .kpi-value{font-family:'JetBrains Mono',monospace; font-size:21px; font-weight:700;}
  .kpi-sub{font-size:12px; color:var(--muted); margin-top:2px;}

  .month-switch{display:flex; align-items:center; gap:12px; margin-bottom:18px;}
  .month-switch button{width:32px; height:32px; border-radius:999px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:16px;}
  .month-title{font-family:'Baloo 2',cursive; font-size:18px; font-weight:600; width:200px; text-align:center; text-transform:capitalize;}

  .charts-grid{display:grid; grid-template-columns:1fr; gap:20px; margin-bottom:20px;}
  @media(min-width:900px){ .charts-grid{grid-template-columns:3fr 2fr;} }
  .chart-card{padding:18px;}
  .legend-row{display:flex; justify-content:space-between; font-size:12px; margin-top:6px;}
  .legend-dot{width:8px; height:8px; border-radius:999px; display:inline-block; margin-right:6px;}

  .tips-card{padding:18px 20px; background:var(--ink); color:var(--paper); border-radius:16px;}
  .tips-title{font-family:'Baloo 2',cursive; font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .tip-item{display:flex; gap:10px; font-size:14px; margin-bottom:10px; opacity:.92;}
  .tip-item .dot{flex:none; margin-top:3px;}

  .excel-bar{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0 4px;}
  .excel-btn{display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:14px; font-size:13px; font-weight:600; background:var(--card); border:1px solid var(--line); color:var(--ink);}
  .excel-btn.primary{background:var(--sage); color:#fff; border:none;}
  .excel-note{font-size:12px; color:var(--muted); margin:8px 0 0;}

  .config-block{padding:16px; margin-bottom:14px;}
  .config-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:640px){ .config-grid{grid-template-columns:repeat(3,1fr);} }

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; color:var(--paper); background:var(--ink); box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:50;}
  .toast.error{background:var(--coral);}
  .saved-tag{margin-left:10px; font-size:13px; font-weight:600; color:var(--sage);}
</style>
</head>

const fmtMonth = key => { const [y,m]=key.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("es-CL",{month:"long",year:"numeric"}); };
const lastDayOfMonth = (y,mIdx) => new Date(y,mIdx+1,0).getDate();
const addMonthKey = (key,delta) => { let [y,m]=key.split("-").map(Number); m+=delta; while(m>12){m-=12;y++;} while(m<1){m+=12;y--;} return `${y}-${String(m).padStart(2,"0")}`; };
const monthsBetweenKeys = (mkStart,mkEnd) => { const [ys,ms]=mkStart.split("-").map(Number); const [ye,me]=mkEnd.split("-").map(Number); return (ye-ys)*12+(me-ms); };
// Si una compra con tarjeta se pagó en varias cuotas, esto dice si esa cuota
// sigue "activa" (impactando la tarjeta) en el mes que se está viendo, y cuánto es.
function getCuotaInfo(entry, viewMonthKey){
  const cuotas = Math.max(1, Number(entry.cuotas)||1);
  // startMonth = mes en que se cobró la cuota N°1. Si el registro no lo trae
  // (datos viejos), asumimos que la fecha ingresada ES la primera cuota.
  const startMonth = entry.startMonth || monthKey(entry.date);
  const idx = monthsBetweenKeys(startMonth, viewMonthKey);
  if(idx<0 || idx>=cuotas) return null;
  // amountMode "cuota" (actual): el monto ingresado YA es lo que se paga cada mes.
  // Sin amountMode (registros viejos): el monto ingresado era el total, se dividía por las cuotas.
  const cuotaAmount = entry.amountMode==="cuota" ? Number(entry.amount) : Number(entry.amount)/cuotas;
  return { idx, cuotas, cuotaAmount };
}
function getCardMonthTotal(cardId, mk){
  return state.cardExpenses.filter(e=>e.card===cardId).reduce((sum,e)=>{
    const info = getCuotaInfo(e, mk);
    return info ? sum + info.cuotaAmount : sum;
  }, 0);
}
// Cuánto queda comprometido en cuotas de meses POSTERIORES al mes que se está viendo,
// para esa tarjeta — útil para saber qué tan "copada" viene la tarjeta hacia adelante.
function getCardFutureCommitment(cardId, fromMonthKey){
  let total = 0;
  state.cardExpenses.filter(e=>e.card===cardId).forEach(e=>{
    const cuotas = Math.max(1, Number(e.cuotas)||1);
    const startMonth = e.startMonth || monthKey(e.date);
    const cuotaAmt = e.amountMode==="cuota" ? Number(e.amount) : Number(e.amount)/cuotas;
    for(let i=0;i<cuotas;i++){
      const mk = addMonthKey(startMonth, i);
      if(mk>fromMonthKey) total += cuotaAmt;
    }
  });
  return total;
}
// Progreso de un crédito de consumo a HOY (no requiere ir registrando cuota a cuota:
// se calcula solo a partir de cuándo empezó y cuántas cuotas tiene en total).
function getCreditProgress(entry, viewMonthKey){
  const totalCuotas = Math.max(1, Math.round(Number(entry.totalCuotas))||1);
  const idx = monthsBetweenKeys(entry.startMonth, viewMonthKey);
  const notStarted = idx < 0;
  const currentCuotaNow = Math.min(totalCuotas, Math.max(1, idx+1));
  const finished = idx >= totalCuotas;
  const remaining = (finished || notStarted) ? (finished?0:totalCuotas) : totalCuotas - currentCuotaNow;
  const cuotaAmount = Number(entry.cuotaAmount)||0;
  const montoRestante = remaining * cuotaAmount;
  const progressPct = notStarted ? 0 : Math.min(100, (currentCuotaNow/totalCuotas)*100);
  const etaMonth = addMonthKey(entry.startMonth, totalCuotas-1);
  return { totalCuotas, currentCuotaNow, finished, notStarted, remaining, montoRestante, progressPct, etaMonth };
}

function normalizeSettings(s){
  const base = { p1:{name:"Persona 1",day:"18"}, p2:{name:"Persona 2",day:"30"}, savingsGoalPct:20, goalLimits:{} };
  if(!s || typeof s !== "object") s = {};
  const savedLimits = (s.goalLimits && typeof s.goalLimits === "object") ? s.goalLimits : {};
  const goalLimits = {};
  GOAL_DEFS.forEach(g=>{
    const v = Number(savedLimits[g.id]);
    goalLimits[g.id] = (!isNaN(v) && v>0) ? v : g.defaultLimit;
  });
  return {
    p1: { name: (s.p1 && s.p1.name) || base.p1.name, day: (s.p1 && s.p1.day) || base.p1.day },
    p2: { name: (s.p2 && s.p2.name) || base.p2.name, day: (s.p2 && s.p2.day) || base.p2.day },
    savingsGoalPct: (typeof s.savingsGoalPct === "number") ? s.savingsGoalPct : base.savingsGoalPct,
    goalLimits,
  };
}

// Trae cambios que la otra persona haya hecho desde otro dispositivo/pestaña.
async function refreshFromCloud(silent){
  try{
    const record = await cloudLoad();
    const safeExpenses = Array.isArray(record.expenses) ? record.expenses : [];
    const safeCardExpenses = Array.isArray(record.cardExpenses) ? record.cardExpenses : [];
    const safeConsumerCredits = Array.isArray(record.consumerCredits) ? record.consumerCredits : [];
    const safeReimbursements = Array.isArray(record.reimbursements) ? record.reimbursements : [];
    const safeSettings = normalizeSettings(record.settings);
    const safeIncome = normalizeIncome(record.income);
    const incoming = JSON.stringify({expenses:safeExpenses, settings:safeSettings, income:safeIncome, cardExpenses:safeCardExpenses, consumerCredits:safeConsumerCredits, reimbursements:safeReimbursements});
    if(incoming !== lastSavedSnapshot){
      state.expenses = safeExpenses;
      state.settings = safeSettings;
      state.income = safeIncome;
      state.cardExpenses = safeCardExpenses;
      state.consumerCredits = safeConsumerCredits;
      state.reimbursements = safeReimbursements;
      lastSavedSnapshot = incoming;
      syncStatus = "ok";
      render();
      if(!silent) showToast("Datos actualizados desde la nube");
    } else {
      syncStatus = "ok";
    }
  }catch(e){
    syncStatus = "unavailable";
    syncErrorDetail = (e && e.message) ? e.message : String(e);
    render();
  }
}

/* ================= Tips ================= */
function generateTips({totalIncome,totalExpense,ahorroReal,metaAhorro,ahorroRealPct,byCategory,prevTotalExpense,goalPct}){
  const tips=[];
  if(totalIncome===0){
    tips.push({tone:"warn",text:"Ingresa los sueldos en Configuración para poder comparar gasto vs. ingreso y calcular su ahorro real."});
  } else if(ahorroReal===0){
    tips.push({tone:"warn",text:`Todavía no registran ningún aporte a "Ahorro" este mes. La meta es ${clp(metaAhorro)} (${goalPct}% del ingreso); si apartan esa plata, regístrenla en Registrar → Ahorro para llevar la cuenta.`});
  } else if(ahorroReal<metaAhorro){
    tips.push({tone:"warn",text:`Llevan ${clp(ahorroReal)} (${ahorroRealPct.toFixed(1)}%) ahorrado este mes, bajo la meta de ${clp(metaAhorro)} (${goalPct}%). No siempre se llega justo, pero si pueden apartar la diferencia antes de fin de mes, se acercan más a la meta.`});
  } else {
    tips.push({tone:"good",text:`¡Lograron la meta! Llevan ${clp(ahorroReal)} ahorrados este mes (${ahorroRealPct.toFixed(1)}% del ingreso), por sobre el ${goalPct}% que se propusieron.`});
  }
  if(byCategory.length>0 && totalIncome>0){
    const top=byCategory[0]; const share=(top.value/totalIncome)*100;
    if(share>=25){
      const advice={
        creditos:"Si son varias tarjetas, ordénenlas por tasa de interés y paguen primero la más cara (método avalancha) para que la deuda deje de crecer.",
        auto:"Revisen si el seguro tiene mejor cotización en otra aseguradora y agrupen trámites de bencina en menos viajes por semana.",
        hogar_personal:"Las comidas fuera y la feria suelen ser el margen más flexible: definan un tope semanal para 'comida fuera' y compren la verdura de la semana en un solo viaje.",
        mascotas:"Comparen precio por kilo del alimento en distintos proveedores y agrupen las compras de alimento para aprovechar descuentos por volumen.",
        basicos:"Revisen consumo de luz y agua en horarios punta; pequeños hábitos bajan la boleta sin gastar en nada nuevo.",
        vivienda:"El arriendo es un gasto fijo grande: si se acerca la renovación de contrato, es buen momento para conversar condiciones con el arrendador.",
      };
      tips.push({tone:"warn",text:`"${top.name}" concentra el ${share.toFixed(0)}% de su ingreso este mes. ${advice[top.id]||"Vale la pena revisarla con detalle."}`});
    }
  }
  if(prevTotalExpense>0 && totalExpense>prevTotalExpense*1.15){
    const delta=((totalExpense/prevTotalExpense)-1)*100;
    tips.push({tone:"warn",text:`El gasto total subió ${delta.toFixed(0)}% respecto al mes anterior. Revisen juntos qué categoría explica el alza antes de que se vuelva costumbre.`});
  }
  tips.push({tone:"neutral",text:"Hábito simple: registren el gasto apenas ocurra, no al final del día. Toma 10 segundos y evita que se les olviden montos chicos que suman harto al mes."});
  return tips.slice(0,5);
}

/* ---- Tips para la pestaña Tarjetas ---- */
function generateCardTips({cardName, viewTotal, byPurchaseCat, prevTotal, futureCommitment, otherCardsTotal}){
  const tips=[];
  if(viewTotal===0){
    tips.push({tone:"neutral",text:`Todavía no registras gastos con ${cardName} este mes.`});
    return tips;
  }
  if(byPurchaseCat.length>0){
    const top=byPurchaseCat[0];
    const share=(top.value/viewTotal)*100;
    if(share>=35){
      tips.push({tone:"warn",text:`"${top.name}" concentra el ${share.toFixed(0)}% de lo gastado con ${cardName} este mes. Si es algo recurrente, vale la pena ver si conviene pagarlo con otro medio en vez de tarjeta.`});
    }
  }
  if(futureCommitment>0){
    tips.push({tone:"warn",text:`Ya tienes ${clp(futureCommitment)} comprometidos en cuotas de meses futuros con ${cardName}. Tenlo presente antes de sacar algo nuevo en cuotas.`});
  }
  if(prevTotal>0 && viewTotal>prevTotal*1.2){
    const delta=((viewTotal/prevTotal)-1)*100;
    tips.push({tone:"warn",text:`El gasto con ${cardName} subió ${delta.toFixed(0)}% respecto al mes anterior.`});
  }
  if(otherCardsTotal>0 && viewTotal>otherCardsTotal*1.5){
    tips.push({tone:"neutral",text:`Este mes estás concentrando la mayoría de tus compras en ${cardName}. Si tiene cupo limitado, ojo con no llegar al tope.`});
  }
  if(tips.length===0){
    tips.push({tone:"good",text:`Buen manejo con ${cardName} este mes: sin categorías que se disparen ni alzas bruscas respecto al mes anterior.`});
  }
  tips.push({tone:"neutral",text:"Registra la compra apenas la hagas — así no se te pierde el hilo de cuántas cuotas te quedan de cada una."});
  return tips.slice(0,4);
}

/* ================= Excel ================= */
function exportExcel(){
  const wb = XLSX.utils.book_new();

  const gastosRows = [["Fecha","CategoriaID","Categoria","DetalleID","Detalle","Monto","Persona","Nota"]];
  [...state.expenses].sort((a,b)=>a.date<b.date?-1:1).forEach(e=>{
    const c=findCat(e.catId), s=findSub(e.catId,e.subId);
    gastosRows.push([e.date, e.catId, c?.name||"", e.subId, s?.name||"", e.amount, e.person, e.note||""]);
  });
  const wsGastos = XLSX.utils.aoa_to_sheet(gastosRows);
  wsGastos["!cols"]=[{wch:12},{wch:14},{wch:20},{wch:16},{wch:22},{wch:12},{wch:14},{wch:26}];
  XLSX.utils.book_append_sheet(wb, wsGastos, "Gastos");

  const months = Array.from(new Set([...state.expenses.map(e=>monthKey(e.date)), ...Object.keys(state.income)])).sort();
  const catIds = CATS.map(c=>c.id);
  const resumenRows = [["Mes","IngresoTotal","GastoTotal","Ahorro","Ahorro%",...CATS.map(c=>c.name)]];
  months.forEach(mk=>{
    const monthEx = state.expenses.filter(e=>monthKey(e.date)===mk);
    const totalExpense = monthEx.reduce((s,e)=>s+Number(e.amount),0);
    const inc = getMonthIncome(mk);
    const totalIncome = inc.p1 + inc.p2;
    const savings = totalIncome-totalExpense;
    const rate = totalIncome>0 ? Math.round((savings/totalIncome)*100) : "";
    const perCat = catIds.map(id => monthEx.filter(e=>e.catId===id).reduce((s,e)=>s+Number(e.amount),0));
    resumenRows.push([mk, totalIncome, totalExpense, savings, rate, ...perCat]);
  });
  const wsResumen = XLSX.utils.aoa_to_sheet(resumenRows);
  XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen Mensual");

  const sueldosRows = [["Mes", `Sueldo ${state.settings.p1.name}`, `Sueldo ${state.settings.p2.name}`]];
  months.forEach(mk=>{ const inc=getMonthIncome(mk); sueldosRows.push([mk, inc.p1, inc.p2]); });
  const wsSueldos = XLSX.utils.aoa_to_sheet(sueldosRows);
  wsSueldos["!cols"]=[{wch:10},{wch:18},{wch:18}];
  XLSX.utils.book_append_sheet(wb, wsSueldos, "Sueldos");

  const cfgRows = [
    ["Campo","Valor"],
    ["Nombre Persona 1", state.settings.p1.name],
    ["Día de pago Persona 1", state.settings.p1.day],
    ["Nombre Persona 2", state.settings.p2.name],
    ["Día de pago Persona 2", state.settings.p2.day],
    ["Meta de ahorro (%)", state.settings.savingsGoalPct],
  ];
  const wsCfg = XLSX.utils.aoa_to_sheet(cfgRows);
  wsCfg["!cols"]=[{wch:24},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsCfg, "Configuración");

  const fname = `cuaderno-cuentas-${todayISO()}.xlsx`;
  XLSX.writeFile(wb, fname);
  showToast("Excel descargado: "+fname);
}

function triggerImport(){ document.getElementById("import-input").click(); }

function importExcel(fileInput){
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, {type:"array"});

      let addedExpenses = 0;
      if(wb.SheetNames.includes("Gastos")){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Gastos"], {defval:""});
        const existingKeys = new Set(state.expenses.map(e=>`${e.date}|${e.amount}|${e.catId}|${e.subId}|${e.person}|${e.note}`));
        const imported = [];
        rows.forEach(r=>{
          const dateVal = r.Fecha instanceof Date ? r.Fecha.toISOString().slice(0,10) : String(r.Fecha||"").slice(0,10);
          const amount = Number(r.Monto);
          if(!dateVal || !amount) return;
          let catId = String(r.CategoriaID||"").trim();
          if(!findCat(catId)){
            const byName = CATS.find(c=>c.name.toLowerCase()===String(r.Categoria||"").toLowerCase().trim());
            catId = byName ? byName.id : CATS[0].id;
          }
          let subId = String(r.DetalleID||"").trim();
          if(!findSub(catId,subId)){
            const cat = findCat(catId);
            const byName = cat.subs.find(s=>s.name.toLowerCase()===String(r.Detalle||"").toLowerCase().trim());
            subId = byName ? byName.id : cat.subs[0].id;
          }
          const person = String(r.Persona||state.settings.p1.name);
          const note = String(r.Nota||"");
          const key = `${dateVal}|${amount}|${catId}|${subId}|${person}|${note}`;
          if(existingKeys.has(key)) return;
          existingKeys.add(key);
          imported.push({ id:uid(), date:dateVal, catId, subId, amount, person, note });
        });
        if(imported.length){ state.expenses = [...imported, ...state.expenses]; addedExpenses = imported.length; }
      }

      let cfgUpdated = false;
      if(wb.SheetNames.includes("Configuración")){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Configuración"], {header:1});
        const map = {};
        rows.forEach(r=>{ if(r[0]) map[String(r[0]).trim()] = r[1]; });
        const next = JSON.parse(JSON.stringify(state.settings));
        if(map["Nombre Persona 1"]!==undefined) next.p1.name = String(map["Nombre Persona 1"]);
        if(map["Día de pago Persona 1"]!==undefined) next.p1.day = String(map["Día de pago Persona 1"]);
        if(map["Nombre Persona 2"]!==undefined) next.p2.name = String(map["Nombre Persona 2"]);
        if(map["Día de pago Persona 2"]!==undefined) next.p2.day = String(map["Día de pago Persona 2"]);
        if(map["Meta de ahorro (%)"]!==undefined) next.savingsGoalPct = Number(map["Meta de ahorro (%)"])||20;
        state.settings = next;
        cfgUpdated = true;
        // Compatibilidad con exportaciones antiguas que traían un sueldo fijo.
        if(map["Sueldo Persona 1"]!==undefined || map["Sueldo Persona 2"]!==undefined){
          const curMonth = monthKey(todayISO());
          state.income[curMonth] = { p1:Number(map["Sueldo Persona 1"]||0), p2:Number(map["Sueldo Persona 2"]||0) };
        }
      }

      let incomeUpdated = false;
      if(wb.SheetNames.includes("Sueldos")){
        const rows = XLSX.utils.sheet_to_json(wb.Sheets["Sueldos"], {defval:""});
        rows.forEach(r=>{
          const mk = String(r.Mes||"").trim();
          if(!/^\d{4}-\d{2}$/.test(mk)) return;
          const keys = Object.keys(r).filter(k=>k!=="Mes");
          const p1val = Number(r[keys[0]])||0;
          const p2val = Number(r[keys[1]])||0;
          state.income[mk] = { p1:p1val, p2:p2val };
        });
        incomeUpdated = true;
      }

      persistExpensesAndSettingsAfterImport(addedExpenses, cfgUpdated || incomeUpdated);
    }catch(err){
      showToast("No se pudo leer el archivo. Revisa que sea el Excel exportado desde aquí.","error");
    }
    fileInput.value = "";
  };
  reader.readAsArrayBuffer(file);
}

function persistExpensesAndSettingsAfterImport(addedExpenses, cfgUpdated){
  render();
  showToast(`Importado: ${addedExpenses} gasto(s) nuevo(s)${cfgUpdated?", configuración actualizada":""}.`);
  syncToCloud();
}

function resolvePaydayDate(dayNum, y, mIdx){
  const dim = lastDayOfMonth(y, mIdx);
  const day = dayNum>=30 ? dim : Math.max(1, Math.min(Math.round(dayNum), dim));
  return new Date(y, mIdx, day);
}
// Encuentra en qué quincena está "hoy" a partir de los días de pago reales configurados
// (ya no asume que siempre es el 18 — funciona con cualquier día que hayan puesto).
function getCurrentPayPeriod(today, settings){
  const y=today.getFullYear(), m=today.getMonth();
  const day1 = Number(settings.p1.day)||18;
  const day2 = Number(settings.p2.day)||30;
  const candidates=[];
  [["p1",day1],["p2",day2]].forEach(([who,dayNum])=>{
    for(let offset=-1; offset<=1; offset++){
      let mm=m+offset, yy=y;
      while(mm<0){mm+=12;yy--;}
      while(mm>11){mm-=12;yy++;}
      candidates.push({who, date: resolvePaydayDate(dayNum, yy, mm)});
    }
  });
  candidates.sort((a,b)=>a.date-b.date);
  let idx=0;
  for(let i=0;i<candidates.length;i++){ if(candidates[i].date<=today) idx=i; }
  const startC = candidates[idx];
  const endC = candidates[idx+1] || candidates[idx];
  return { start: startC.date, end: endC.date, payerKeyName: startC.who };
}

function renderHeader(){

  const todayMidnight = new Date(y,m,d);

  const msDay=86400000;
  const totalDays=Math.max(1,Math.round((end-start)/msDay));
  const elapsed=Math.min(totalDays,Math.max(0,Math.round((today-start)/msDay)));
  const daysLeft=Math.max(0,totalDays-elapsed);
  const progressPct=Math.min(100,(elapsed/totalDays)*100);
  const spent = state.expenses.filter(e=>{const ed=new Date(e.date+"T00:00:00"); return ed>=start && ed<=end && e.catId!=="reembolsables";}).reduce((s,e)=>s+Number(e.amount||0),0);
  const available = getMonthIncome(payMonthKey)[payerKeyName];
  const spentPct = available>0 ? Math.min(100,(spent/available)*100) : 0;
  const over = available>0 && spent>available;

  return `
  <div style="margin-bottom:18px;border-radius:24px;overflow:hidden;background:var(--field);display:flex;align-items:center;justify-content:center;max-height:260px;"><img src="${HOUSE_BANNER_SRC}" alt="Ilustración de una casita con dos chicas recibiendo a una gatita y un perrito" style="width:100%;height:100%;max-height:260px;object-fit:contain;display:block;"></div>
  <div class="top-eyebrow">
    <h1 class="ff-display" style="font-size:28px;font-weight:600;letter-spacing:-0.01em;">Cuaderno de Cuentas</h1>
    <span class="eyebrow">${state.settings.p1.name} &amp; ${state.settings.p2.name}</span>
  </div>
  <p class="subline">${today.toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="card runway-card">
    <div class="runway-top">
      <div>
        <div class="runway-label">Quincena en curso</div>
        <div class="runway-range">${fmtDayShort(start)} → ${fmtDayShort(end)} <span>(financiada por ${payer.name})</span></div>
      </div>
      <div>
        <div class="runway-label" style="text-align:right;">Quedan</div>
        <div class="runway-days" style="color:${daysLeft<=3?CORAL:INK};">${daysLeft} ${daysLeft===1?"día":"días"}</div>
      </div>
    </div>
    <div class="runway-bar">
      <div class="runway-fill-time" style="width:${progressPct}%;background:linear-gradient(90deg, ${SAGE}, ${GOLD});"></div>
      <div class="runway-fill-spent" style="width:${Math.max(spentPct, available>0?2:0)}%; background:${over?CORAL:INK};"></div>
      <div class="runway-overlay" style="color:${spentPct>12?"#FFF6EF":INK};">
        <span>${clp(spent)} gastado</span>
        ${available>0?`<span style="color:${over?CORAL:MUTED};font-weight:700;">${clp(available)} disponible</span>`:""}
      </div>
    </div>
    ${available===0?`<p class="hint-text">Ingresa el sueldo de este mes en <b>Resumen</b> para ver cuánto queda disponible en esta quincena.</p>`:""}
    ${over?`<p class="warn-text">⚠ Ya superaron el sueldo de esta quincena en ${clp(spent-available)}.</p>`:""}
  </div>`;
}

  { id:"bencina", catId:"auto", subIds:["bencina"], label:"Bencina", emoji:"⛽", defaultLimit:245000 },

  { id:"basicos", catId:"basicos", subIds:["agua","luz","gas","telefonia","internet"], label:"Gastos Básicos (luz, agua, gas, teléfono, internet)", emoji:"⚡", defaultLimit:110000 },
  { id:"estacionamiento", catId:"reembolsables", subIds:["estacionamientos"], label:"Estacionamiento", emoji:"🅿️", defaultLimit:82000 },

function getGoals(){
  return GOAL_DEFS.map(g=>({ ...g, monthlyLimit: Number(state.settings.goalLimits?.[g.id]) || g.defaultLimit }));
}

function goalSpent(g, mKey){
  return state.expenses
    .filter(e=>monthKey(e.date)===mKey && e.catId===g.catId && (g.subIds===null || g.subIds.includes(e.subId)) && e.amount>0)
    .reduce((s,e)=>s+Number(e.amount),0);
}

const SAVINGS_TIPS = [
  "Antes de comprar algo no esencial, espera 24 horas: si al día siguiente lo sigues queriendo, cómpralo.",
  "Revisa tus suscripciones cada 3 meses: cancela las que no usaste el último mes.",
  "Lleva una botella de agua y un snack cuando salgas, así evitas compras de último minuto.",
  "Antes de ir al supermercado, haz una lista corta y cíñete a ella: reduce compras por impulso.",
  "Aparta el ahorro apenas te paguen (no lo que 'sobra' a fin de mes) — así se cumple de verdad.",
];

function getSmartTip(mKey){
  const dayIdx = new Date().getDate();
  const progress = getGoals().map(g=>({ g, ratio: goalSpent(g,mKey)/g.monthlyLimit }));
  const worst = progress.reduce((a,b)=>b.ratio>a.ratio?b:a, progress[0]);

  if(worst && worst.ratio>=1){
    const pool = GOAL_TIPS[worst.g.id] || SAVINGS_TIPS;
    return { tone:"alert", color:CORAL, text:`Ya superaron la meta de ${worst.g.label} este mes. ${pool[dayIdx % pool.length]}` };
  }
  if(worst && worst.ratio>=0.7){
    const pool = GOAL_TIPS[worst.g.id] || SAVINGS_TIPS;
    return { tone:"warn", color:GOLD, text:`Se están acercando al límite de ${worst.g.label} (${Math.round(worst.ratio*100)}% usado). ${pool[dayIdx % pool.length]}` };
  }
  return { tone:"ok", color:SAGE, text:`Vas bien este mes 🎉 ${SAVINGS_TIPS[dayIdx % SAVINGS_TIPS.length]}` };
}

function renderGoalsSavingsTips(){
  const mKey = state.registrarView.month;

  // --- Ahorro del mes seleccionado (no histórico) ---
  const ahorroMes = state.expenses
    .filter(e=>monthKey(e.date)===mKey && e.catId==="ahorro")
    .reduce((s,e)=>s+Number(e.amount),0);

  // --- Meta del mes = ingreso del mes x % meta configurado en Resumen ---
  const pct = Number(state.settings.savingsGoalPct)||0;
  const incMes = getMonthIncome(mKey);
  const metaMes = (Number(incMes.p1||0)+Number(incMes.p2||0)) * pct/100;

  let ahorroColor = MUTED, ahorroLabel = "Configura sueldos y meta en Resumen para activar el semáforo.";
  if(metaMes>0){
    const ratio = ahorroMes/metaMes;
    if(ratio>=1.1){ ahorroColor=STEEL; ahorroLabel=`¡La superaron! Van ${(ratio*100).toFixed(0)}% de la meta de ${fmtMonth(mKey)} (${clp(metaMes)}).`; }
    else if(ratio>=1){ ahorroColor=SAGE; ahorroLabel=`¡Llegaron a la meta de ${fmtMonth(mKey)}: ${clp(metaMes)}!`; }
    else if(ratio>=0.5){ ahorroColor=GOLD; ahorroLabel=`Se están acercando: ${(ratio*100).toFixed(0)}% de la meta de ${fmtMonth(mKey)} (${clp(metaMes)}).`; }
    else { ahorroColor=CORAL; ahorroLabel=`Aún lejos de la meta de ${fmtMonth(mKey)}: ${clp(metaMes)} (${(ratio*100).toFixed(0)}%).`; }
  }

  // --- Tip inteligente según cómo van las metas del mes ---
  const smart = getSmartTip(mKey);

  return `
    <div class="card" style="padding:12px 14px;text-align:center;background:${ahorroColor}15;border-color:${ahorroColor};">
      <div style="font-size:11px;color:${MUTED};margin-bottom:3px;">🐷 Ahorro de ${fmtMonth(mKey)}</div>
      <div class="ff-mono" style="font-size:19px;font-weight:800;color:${ahorroColor};line-height:1.1;">${clp(ahorroMes)}</div>
      <p style="font-size:10px;color:${INK};margin:5px 0 0;line-height:1.35;">${ahorroLabel}</p>
    </div>

    <div class="card" style="padding:12px 14px;background:${smart.color}12;border-color:${smart.color};">
      <h3 class="ff-display" style="font-size:12.5px;font-weight:600;margin-bottom:5px;">${smart.tone==="alert"?"🚨":smart.tone==="warn"?"⚠️":"💡"} Tip de ahorro</h3>
      <p style="font-size:11px;line-height:1.4;color:${INK};margin:0;">${smart.text}</p>
    </div>`;
}

function drawCardChart(){

  if(canvas && byPurchaseCat.length){
    const palette = [INK,GOLD,CORAL,STEEL,PLUM,PEACH,INDIGO,CLAY,TEAL];
    let normalIdx = 0;
    const colors = byPurchaseCat.map(c=>{
      if(c.special) return SAGE; // reembolsable: siempre el mismo verde, "plata que vuelve"
      return palette[(normalIdx++)%palette.length];
    });
    cardCatChart = new Chart(canvas, {
      type:"doughnut",
      data:{ labels: byPurchaseCat.map(c=>c.name), datasets:[{ data: byPurchaseCat.map(c=>c.value), backgroundColor: colors, borderWidth:2, borderColor:"#fff" }] },
      options:{ responsive:true, cutout:"62%", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => clp(ctx.parsed) } } } }
    });

}

function generateCreditTips(list){
  const tips=[];
  if(list.length===0){
    tips.push({tone:"neutral",text:"Registra aquí cualquier crédito de consumo para hacerle seguimiento: en cuántas cuotas quedó, cuántas llevan, y cuándo termina."});
    return tips;
  }
  const active = list.filter(c=>!c.progress.finished && !c.progress.notStarted);
  const lastCuotaNow = active.filter(c=>c.progress.remaining===0);
  const justFinished = list.filter(c=>c.progress.finished);

  lastCuotaNow.forEach(c=>{
    tips.push({tone:"good",text:`🎉 ¡Esta es la última cuota de "${c.entry.name}"! Después de este mes esa plata queda libre — buen momento para pasarla directo a Ahorro.`});
  });
  justFinished.forEach(c=>{
    tips.push({tone:"good",text:`✅ Ya terminaste de pagar "${c.entry.name}". Si no lo has hecho, bórralo de la lista o dale otro destino a esa cuota mensual.`});
  });
  active.filter(c=>c.progress.remaining>0 && c.progress.remaining<=3).forEach(c=>{
    tips.push({tone:"warn",text:`Te quedan solo ${c.progress.remaining} cuota(s) de "${c.entry.name}" — ya casi termina.`});
  });
  if(active.length>0){
    const totalMonthly = active.reduce((s,c)=>s+Number(c.entry.cuotaAmount),0);
    tips.push({tone:"neutral",text:`Entre los ${active.length} crédito(s) activos, están destinando ${clp(totalMonthly)} al mes entre ambos. Si pueden adelantar cuotas del que tenga menos plazo restante, se liberan de esa cuota mensual antes.`});
  }
  if(active.length>=2){
    tips.push({tone:"warn",text:"Mientras tengan más de un crédito de consumo activo, eviten sacar uno nuevo — prioricen terminar los que ya tienen antes de comprometerse con otro."});
  }
  return tips.slice(0,5);
}

  const monthExpenses = monthExpensesAll.filter(e=>e.catId!=="reembolsables" && e.catId!=="ahorro");
  const reembolsablesTotal = monthExpensesAll.filter(e=>e.catId==="reembolsables").reduce((s,e)=>s+Number(e.amount),0);
  const ahorroReal = monthExpensesAll.filter(e=>e.catId==="ahorro").reduce((s,e)=>s+Number(e.amount),0);
  const prevMonthExpenses = state.expenses.filter(e=>monthKey(e.date)===addMonthKey(state.selectedMonth,-1) && e.catId!=="reembolsables" && e.catId!=="ahorro");
  const totalExpense = monthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const prevTotalExpense = prevMonthExpenses.reduce((s,e)=>s+Number(e.amount),0);
  const monthIncome = getMonthIncome(state.selectedMonth);
  const totalIncome = monthIncome.p1 + monthIncome.p2;
  const metaAhorro = totalIncome * (Number(state.settings.savingsGoalPct)||0) / 100;
  const ahorroRealPct = totalIncome>0 ? (ahorroReal/totalIncome)*100 : null;
  const ahorroAcumulado = state.expenses
    .filter(e=>e.catId==="ahorro" && monthKey(e.date)<=state.selectedMonth)
    .reduce((s,e)=>s+Number(e.amount),0);

  const byCategory = (()=>{
    const map={}; monthExpenses.forEach(e=>{ map[e.catId]=(map[e.catId]||0)+Number(e.amount); });
    return CATS.map(c=>({id:c.id,name:c.name,color:c.color,value:map[c.id]||0})).filter(c=>c.value>0).sort((a,b)=>b.value-a.value);
  })();

  const byPerson = (()=>{
    const p1Total = monthExpenses.filter(e=>e.person===state.settings.p1.name).reduce((s,e)=>s+Number(e.amount),0);
    const p2Total = monthExpenses.filter(e=>e.person===state.settings.p2.name).reduce((s,e)=>s+Number(e.amount),0);
    const otherTotal = totalExpense - p1Total - p2Total;
    return [
      { name: state.settings.p1.name, value: p1Total },
      { name: state.settings.p2.name, value: p2Total },
      ...(otherTotal > 0 ? [{ name: "Otro", value: otherTotal }] : []),
    ];
  })();

  const byWeek = (()=>{
    const map={}; monthExpenses.forEach(e=>{ const mon=weekMonday(e.date); const key=mon.toISOString().slice(0,10); map[key]=(map[key]||0)+Number(e.amount); });
    return Object.entries(map).sort((a,b)=>a[0]<b[0]?-1:1).map(([key,val])=>{
      const start=new Date(key+"T00:00:00"); const end=new Date(start); end.setDate(end.getDate()+6);
      return { label:`${fmtDayShort(start)}–${fmtDayShort(end)}`, total:val };
    });
  })();

  window.__resumenData = { byWeek, byCategory };

  const tips = generateTips({ totalIncome, totalExpense, ahorroReal, metaAhorro, ahorroRealPct, byCategory, prevTotalExpense, goalPct: state.settings.savingsGoalPct });

  const legendRows = byCategory.map(c=>`<div class="legend-row"><span><span class="legend-dot" style="background:${c.color};"></span>${c.name}</span><span class="ff-mono" style="font-weight:600;">${clp(c.value)}</span></div>`).join("");

  const tipDotColor = t => t.tone==="warn"?CORAL:t.tone==="good"?SAGE:GOLD;
  const tipsHtml = tips.map(t=>`<div class="tip-item"><span class="dot" style="color:${tipDotColor(t)};">●</span><span>${t.text}</span></div>`).join("");

  return `
  <div class="month-switch">
    <button onclick="shiftMonth(-1)">‹</button>
    <div class="month-title ff-display">${fmtMonth(state.selectedMonth)}</div>
    <button onclick="shiftMonth(1)">›</button>
  </div>

  <div class="card" style="padding:16px;margin-bottom:16px;">
    <div class="field-label" style="margin-bottom:10px;">Sueldos de ${fmtMonth(state.selectedMonth)}</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;">
      <div>
        <label class="field-label">${state.settings.p1.name}</label>
        <input id="inc-p1" type="number" min="0" step="1000" class="field ff-mono" style="margin-bottom:0;width:160px;" value="${monthIncome.p1}">
      </div>
      <div>
        <label class="field-label">${state.settings.p2.name}</label>
        <input id="inc-p2" type="number" min="0" step="1000" class="field ff-mono" style="margin-bottom:0;width:160px;" value="${monthIncome.p2}">
      </div>
      <button type="button" class="excel-btn primary" onclick="saveMonthIncome()">Guardar sueldos</button>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="card kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:${STEEL}22;color:${STEEL};">💰</div><span class="kpi-label">Ingreso del mes</span></div><div class="kpi-value">${clp(totalIncome)}</div></div>
    <div class="card kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:${CORAL}22;color:${CORAL};">📉</div><span class="kpi-label">Gasto del mes</span></div><div class="kpi-value">${clp(totalExpense)}</div></div>
    <div class="card kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:${MUTED}22;color:${MUTED};">🎯</div><span class="kpi-label">Meta de ahorro</span></div><div class="kpi-value">${clp(metaAhorro)}</div><div class="kpi-sub">${state.settings.savingsGoalPct}% del ingreso</div></div>
    <div class="card kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:${ahorroReal>=metaAhorro?SAGE:CORAL}22;color:${ahorroReal>=metaAhorro?SAGE:CORAL};">🐷</div><span class="kpi-label">Ahorro real</span></div><div class="kpi-value">${clp(ahorroReal)}</div><div class="kpi-sub">${ahorroRealPct!==null?ahorroRealPct.toFixed(1)+"% del ingreso":"Configura los sueldos"}</div></div>
    <div class="card kpi-card"><div class="kpi-top"><div class="kpi-icon" style="background:${PEACH}22;color:${PEACH};">🧾</div><span class="kpi-label">Por reembolsar</span></div><div class="kpi-value">${clp(reembolsablesTotal)}</div><div class="kpi-sub">No se cuenta como gasto del hogar</div></div>
  </div>

  <div class="card" style="padding:18px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <div>
      <h3 class="ff-display" style="font-size:16px;font-weight:600;margin-bottom:4px;">Ahorro acumulado</h3>
      <p style="font-size:12px;color:${MUTED};margin:0;">Suma de todo lo registrado en "Ahorro" hasta ${fmtMonth(state.selectedMonth)}</p>
    </div>
    <div class="ff-mono" style="font-size:22px;font-weight:700;color:${SAGE};">${clp(ahorroAcumulado)}</div>
  </div>

  <div class="card" style="padding:18px;margin-bottom:20px;">
    <h3 class="ff-display" style="font-size:16px;font-weight:600;margin-bottom:14px;">Gasto por persona</h3>
    ${totalExpense===0
      ? `<div style="font-size:14px;color:${MUTED};">Sin gastos registrados este mes.</div>`
      : byPerson.map(p=>{
          const pct = totalExpense>0 ? (p.value/totalExpense)*100 : 0;
          return `<div style="margin-bottom:12px;">
            <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:5px;">
              <span>${p.name}</span>
              <span class="ff-mono">${clp(p.value)} <span style="color:${MUTED};font-weight:500;">(${pct.toFixed(0)}%)</span></span>
            </div>
            <div style="height:10px;border-radius:999px;background:var(--track);overflow:hidden;">
              <div style="height:100%;width:${pct}%;border-radius:999px;background:${INDIGO};"></div>
            </div>
          </div>`;
        }).join("")}
  </div>

  <div class="charts-grid">
    <div class="card chart-card">
      <h3 class="ff-display" style="font-size:16px;font-weight:600;margin-bottom:12px;">Gasto por semana</h3>
      ${byWeek.length===0?`<div style="height:200px;display:flex;align-items:center;justify-content:center;color:${MUTED};font-size:14px;">Sin gastos registrados este mes.</div>`:`<canvas id="weekChart" height="180"></canvas>`}
    </div>
    <div class="card chart-card">
      <h3 class="ff-display" style="font-size:16px;font-weight:600;margin-bottom:12px;">Gasto por categoría</h3>
      ${byCategory.length===0?`<div style="height:200px;display:flex;align-items:center;justify-content:center;color:${MUTED};font-size:14px;">Sin datos aún.</div>`:`<canvas id="catChart" height="150"></canvas><div style="margin-top:8px;">${legendRows}</div>`}
    </div>
  </div>

  <div class="tips-card">
    <h3 class="tips-title">✨ Tips para este mes</h3>
    ${tipsHtml}
  </div>`;
}

function drawCharts(){
  const { byWeek, byCategory } = window.__resumenData || {byWeek:[],byCategory:[]};
  if(weekChart){ weekChart.destroy(); weekChart=null; }
  if(catChart){ catChart.destroy(); catChart=null; }

  const weekCanvas = document.getElementById("weekChart");
  if(weekCanvas && byWeek.length){
    weekChart = new Chart(weekCanvas, {
      type:"bar",
      data:{ labels: byWeek.map(w=>w.label), datasets:[{ data: byWeek.map(w=>w.total), backgroundColor: GOLD, borderRadius:6, maxBarThickness:44 }] },
      options:{ responsive:true, plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => clp(ctx.parsed.y) } } },
        scales:{ y:{ ticks:{ callback:v=> v>=1000?(v/1000)+"k":v, color:MUTED, font:{size:11} }, grid:{ color:"#F5DCE4" } },
                 x:{ ticks:{ color:MUTED, font:{size:11} }, grid:{ display:false } } } }
    });
  }
  const catCanvas = document.getElementById("catChart");
  if(catCanvas && byCategory.length){
    catChart = new Chart(catCanvas, {
      type:"doughnut",
      data:{ labels: byCategory.map(c=>c.name), datasets:[{ data: byCategory.map(c=>c.value), backgroundColor: byCategory.map(c=>c.color), borderWidth:2, borderColor:"#fff" }] },
      options:{ responsive:true, cutout:"62%", plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: ctx => clp(ctx.parsed) } } } }
    });
  }
}

function renderConfig(){
  const s = state.settings;
  return `
  <form onsubmit="saveConfig(event)" style="max-width:640px;">
    <h2 class="ff-display" style="font-size:18px;font-weight:600;margin-bottom:4px;">Nombres y días de pago</h2>
    <p style="font-size:14px;color:${MUTED};margin:0 0 18px;">El <b>monto</b> del sueldo se ingresa mes a mes en la pestaña <b>Resumen</b>, porque varía. Acá quedan los nombres y el día en que cobra cada uno — como ese día también puede cambiar de un mes a otro, es un número editable: cámbialo cuando corresponda y el carril de la quincena se ajusta solo.</p>

    <div class="card config-block">
      <div class="config-grid">
        <div><label class="field-label">Nombre</label><input id="cfg-p1-name" class="field" style="margin-bottom:0;" value="${s.p1.name}"></div>
        <div><label class="field-label">Día de pago este mes</label>
          <input id="cfg-p1-day" type="number" min="1" max="31" class="field ff-mono" style="margin-bottom:0;" value="${Number(s.p1.day)||18}">
        </div>
      </div>
    </div>

    <div class="card config-block">
      <div class="config-grid">
        <div><label class="field-label">Nombre</label><input id="cfg-p2-name" class="field" style="margin-bottom:0;" value="${s.p2.name}"></div>
        <div><label class="field-label">Día de pago este mes</label>
          <input id="cfg-p2-day" type="number" min="1" max="31" class="field ff-mono" style="margin-bottom:0;" value="${Number(s.p2.day)||30}">
        </div>
      </div>
    </div>

    <div class="card config-block">
      <label class="field-label">Meta de ahorro mensual (%)</label>
      <input id="cfg-goal" type="number" min="0" max="100" class="field ff-mono" style="width:120px;margin-bottom:0;" value="${s.savingsGoalPct}">
    </div>

    <button type="submit" class="submit-btn" style="width:auto;padding:11px 22px;">Guardar configuración</button>
  </form>

  <form onsubmit="saveGoalLimits(event)" style="max-width:640px;margin-top:36px;">
    <h2 class="ff-display" style="font-size:18px;font-weight:600;margin-bottom:4px;">🎯 Metas de gasto</h2>
    <p style="font-size:14px;color:${MUTED};margin:0 0 18px;">Estos son los montos que ven en la pestaña Metas. Cámbialos cuando quieran ajustar un presupuesto — se guarda directo, sin tocar código.</p>

    <div class="card config-block">
      <div style="display:flex;flex-direction:column;gap:14px;">
        ${getGoals().map(g=>`
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="flex:1;font-size:14px;">${g.emoji} ${g.label}</div>
            <input id="goal-${g.id}" type="number" min="0" step="1000" class="field ff-mono" style="width:150px;margin-bottom:0;" value="${g.monthlyLimit}">
          </div>`).join("")}
      </div>
    </div>

    <button type="submit" class="submit-btn" style="width:auto;padding:11px 22px;">Guardar metas</button>
  </form>`;
}

loadAll();

window.addEventListener("beforeunload", (e) => {
  if (unsavedChanges) {
    e.preventDefault();
    e.returnValue = "";
    return "";
  }
});

</script>
</body>
</html>
